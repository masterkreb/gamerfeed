name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, TypeScript und Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: PHP-Proxy syntaktisch prüfen
        run: php -l tools/feed-proxy.php

      - name: Tests ausführen
        run: npm test

      - name: TypeScript prüfen
        run: npm run typecheck

      - name: Produktions-Build erstellen
        run: npm run build

  e2e:
    name: Browser-Abnahme (Chromium)
    runs-on: ubuntu-latest
    # Eigener Job ohne produktive Endpunkte und ohne Schreib-Secrets: die
    # Browser-Suite stellt alle API-Antworten selbst.
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Chromium installieren
        run: npx playwright install --with-deps chromium

      - name: Browser-Tests ausführen
        run: npm run test:e2e

      - name: Artefakte bei Fehlern sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
