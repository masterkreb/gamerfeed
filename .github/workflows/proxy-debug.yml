name: Feed-Proxy Diagnose

# Einmalige Fehlersuche: openresty weist Anfragen der Actions-Runner mit 415 ab,
# bevor PHP laeuft. Diese Sonde klaert, ob die IP-Kategorie oder das
# Anfragemuster (Ziel-URL als Query-Parameter) blockiert wird.
# Nach der Diagnose wieder entfernen.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Anfragemuster gegen den Proxy-Host testen
        env:
          FEED_PROXY_URL: ${{ secrets.FEED_PROXY_URL }}
        run: |
          if [ -z "$FEED_PROXY_URL" ]; then
            echo "FEED_PROXY_URL ist nicht gesetzt."
            exit 1
          fi

          base="${FEED_PROXY_URL%/*}"
          feed="https%3A%2F%2Fwww.gamepro.de%2Frss%2Fgamepro.rss"

          # Gibt nur Beschriftung und Status aus, nie die URL selbst.
          probe() {
            printf '    %-46s ' "$1"
            curl -s -o /dev/null -w 'status=%{http_code}\n' --max-time 25 "$2"
          }

          echo "--- Statische Datei im selben Ordner ---"
          probe "index.html (kein PHP, keine Query)" "$base/index.html"

          echo "--- PHP ohne Query ---"
          probe "feed-proxy.php ohne Parameter" "$FEED_PROXY_URL"

          echo "--- PHP mit harmloser Query ---"
          probe "?feed=gamepro" "$FEED_PROXY_URL?feed=gamepro"
          probe "?url=gamepro (kein http)" "$FEED_PROXY_URL?url=gamepro"

          echo "--- PHP mit URL als Parameter ---"
          probe "?url=<encoded https://...>" "$FEED_PROXY_URL?url=$feed"
          probe "?url=<unencoded https://...>" "$FEED_PROXY_URL?url=https://www.gamepro.de/rss/gamepro.rss"

          echo "--- Andere Seite auf demselben Hosting ---"
          probe "Startseite der Domain" "${base%/*}/"
